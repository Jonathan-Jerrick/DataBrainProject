<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsightBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/query-builder.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="top-nav">
      <div class="top-nav-left">
        <div class="logo">📊 InsightBoard</div>
        <h1 class="page-title" id="page-title">Dashboard</h1>
      </div>
      <div class="top-nav-center">
        <input type="search" class="global-search" id="global-search" placeholder="Search charts and datasets...">
      </div>
      <div class="top-nav-right">
        <span class="role-badge" id="role-badge">—</span>
        <div class="user-switcher" id="user-switcher"></div>
      </div>
    </header>
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="#dashboard" class="sidebar-link" data-route="dashboard" data-tooltip="Dashboard">
          <span class="sidebar-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-4a0 0 0 0 1 0 0v-7H10v7H6a2 2 0 0 1-2-2z"/></svg></span>
          <span>Dashboard</span>
        </a>
        <a href="#datasets" class="sidebar-link" data-route="datasets" data-tooltip="Datasets">
          <span class="sidebar-icon"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v6c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 11v6c0 1.7 4 3 9 3s9-1.3 9-3v-6"/></svg></span>
          <span>Datasets</span>
        </a>
        <a href="#query-builder" class="sidebar-link" data-route="query-builder" data-tooltip="Query Builder">
          <span class="sidebar-icon"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/><circle cx="17" cy="6" r="2"/><circle cx="11" cy="12" r="2"/><circle cx="15" cy="18" r="2"/></svg></span>
          <span>Query Builder</span>
        </a>
        <div class="sidebar-divider"></div>
        <a href="#users" class="sidebar-link" data-route="users" data-requires-permission="manage_users" data-tooltip="Users">
          <span class="sidebar-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <span>Users</span>
        </a>
      </nav>
      <div class="sidebar-footer">v1.0 · DataBrain Mini</div>
    </aside>
    <main class="main-content" id="main-content"></main>
  </div>

  <div id="toast-container"></div>
  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="viewer-banner" class="viewer-banner hidden"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
